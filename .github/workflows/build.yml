name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev
      - name: Rust fmt, clippy, tests
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  windows:
    name: windows (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust build
        working-directory: rust
        run: cargo build --release
      - name: Build Windows installer (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./windows/build-release.ps1
      - name: Publish release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-win/t1-customizer-*-setup.exe
            dist-win/t1-keyboard-config.exe
            dist-win/t1-keyboard-config-gui.exe
